# Inert reference template. Copy this file deliberately into a repository's
# .github/workflows/ directory only after replacing <UNITY_PROJECT_PATH>.
# Validate the copied workflow and configure its referenced secrets before use.
name: Unity tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  unity-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run EditMode tests
        id: editmode-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: <UNITY_PROJECT_PATH>
          testMode: EditMode
          artifactsPath: artifacts/editmode

      - name: Upload EditMode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-editmode
          path: ${{ steps.editmode-tests.outputs.artifactsPath }}

      - name: Run PlayMode tests
        if: ${{ !cancelled() }}
        id: playmode-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: <UNITY_PROJECT_PATH>
          testMode: PlayMode
          artifactsPath: artifacts/playmode

      - name: Upload PlayMode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-playmode
          path: ${{ steps.playmode-tests.outputs.artifactsPath }}
