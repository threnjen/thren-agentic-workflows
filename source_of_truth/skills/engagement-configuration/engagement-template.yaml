# Complete this engagement configuration. Then resume the Client Deliverable agent.
#
# Replace every FILL ME.
# Delete each optional line you do not need. Optional lines start with ## and show an example value.
# Paths may be absolute or relative to this file.
# This file sends nothing. The workflow quotes only paths back to you.

# ---------------------------------------------------------------------------
# The paperwork
# ---------------------------------------------------------------------------

# List every SOW or contract document, including any base SOW, update, or amendment.
# List documents from LOWEST priority to highest priority.
# Each later document overrides every earlier document wherever they disagree.
# Do not merge documents by hand. The order determines the result.
sow_document:
  - FILL ME                 # e.g. /Users/you/repos/ops/projects/acme/acme-sow1.md
##  - /Users/you/repos/ops/projects/acme/sow-update-20260707.md
##  - /Users/you/repos/ops/projects/acme/sow-amendments.md   # wins on conflict

deliverables_spec: FILL ME  # the document that states what you owe the client
                            # e.g. /Users/you/repos/ops/projects/acme/deliverables-spec.md

# ---------------------------------------------------------------------------
# What you're comparing
# ---------------------------------------------------------------------------
# Add one entry for each before-and-after comparison.
# Copy the full block for each additional comparison. You can add any number of comparisons.
# A second fully worked example appears at the bottom of this file.

pairs:
  - name: FILL ME           # use a short label for this comparison, such as widget-api
    type: repo              # 'repo' means two separate folders. See the branch example below.

    original:               # the OLD codebase
      path: FILL ME         # Example: /Users/you/repos/acme/widget-api-orig

      ## If you already ran code or infrastructure audits, point to each side's audit paths.
      code_audit_path:  /Users/you/repos/acme/widget-api/dev/code-audit/orig-code/codex
      infra_audit_path: /Users/you/repos/acme/widget-api/dev/infra-audit/orig-code/codex

    upgraded:               # the NEW codebase
      path: FILL ME         # Example: /Users/you/repos/acme/widget-api

      ## If you already ran code or infrastructure audits, point to each side's audit paths.
      code_audit_path:  /Users/you/repos/acme/widget-api/dev/code-audit/20260804/codex
      infra_audit_path: /Users/you/repos/acme/widget-api/dev/infra-audit/20260804/codex

      ## If manual QA uses a file other than docs/QA_USER.md, list each applicable file here.
      ## The QA gate checks each listed file. It does not request QA_USER.md.
      ## The automated runbook path remains unchanged.
      manual_qa_paths:
            - docs/QA_USER-MICK.md
          
    ## If you have finished delta reports for the two sides, add their paths here.
      code_delta_path: /Users/you/repos/acme/widget-api/dev/code-audit/20260804/codex/delta.md
      infra_delta_path: /Users/you/repos/acme/widget-api/dev/infra-audit/20260804/codex/delta.md

