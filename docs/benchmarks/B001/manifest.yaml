benchmark_id: B001
status: draft
owner: project-maintainers
last_updated: 2026-04-22

description: >
  Initial agent regression benchmark pack for github-agents-source-of-truth.
  Designed for A/B testing across model, prompt, and custom agent variants.

paths:
  readme: docs/benchmarks/B001/README.md
  tasks_core: docs/benchmarks/B001/tasks/core.yaml
  graders: docs/benchmarks/B001/graders/README.md
  run_config_example: docs/benchmarks/B001/runs/run-config.example.yaml

task_counts:
  total: 30
  family_A_planning: 8
  family_B_decomposition: 5
  family_C_implementation: 6
  family_D_review: 5
  family_E_documentation: 3
  family_F_orchestration: 3

thresholds:
  hard_pass_drop_fail_percent: 2.0
  non_inferiority:
    max_quality_drop: -0.10
    max_hard_pass_drop_percent: -1.0
    min_cost_per_pass_improvement_percent: 15.0

execution_defaults:
  repeats_per_task: 3
  randomize_task_order: true
  pin_grader_version: true
  single_variable_change_required: true

report_contract:
  required_fields:
    - verdict
    - baseline_variant
    - candidate_variant
    - pass_rate_delta
    - quality_delta
    - compliance_violation_delta
    - cost_per_pass_delta
    - p50_latency_delta
    - p90_latency_delta
    - regressions_by_family
