phase_eval:
  benchmark_style: phase-01-lightweight
  run_id: PHASE-EVAL-06d-20260506-120000
  phase_slug: phase-06e
  baseline_sha: <git-sha-used-as-baseline>
  repo_root: <absolute-or-relative-target-repo-path>

runtime:
  harness: copilot
  model: <exact-current-model-label>
  grader_agent: 05 Eval - Grader
  commit_granularity: ac
  expected_commit_policy: one-commit-per-ac

inputs:
  rubric_path: eval/rubrics/phase-06e-planning-and-implementation.yaml
  ledger_commits_path: eval/runs/phase-06e/ledger-commits.jsonl
  ledger_events_path: eval/runs/phase-06e/ledger-events.jsonl
  run_config_path: eval/runs/phase-06e/run-config.yaml

constraints:
  phase_branch_required: true
  one_variable_change_required: true
  pin_grader_version: true

execution_defaults:
  repeats_per_task: 3
  randomize_task_order: true
  timeout_seconds_per_task: 900

recommended_gates:
  hard_pass_drop_fail_percent: 2.0
  non_inferiority:
    max_quality_drop: -0.10
    max_hard_pass_drop_percent: -1.0
    min_cost_per_pass_improvement_percent: 15.0

output:
  score_report_path: eval/runs/phase-06e/score-report-<YYYYMMDD-HHMMSS>.md
  optional_run_contract_path: eval/runs/phase-06e/run-contract.json

notes:
  - Keep harness and model values stable for all rows in this run.
  - When commit_granularity is ac, include the exact criterion ID in every implement/review commit message.
  - When expected_commit_policy is one-commit-per-ac, do not batch multiple ACs into one implement/review commit unless the rubric explicitly permits it.
  - Implementation records should retain AC coverage rows with planned test IDs, planned test patterns, evidence paths, and commit SHAs or PENDING placeholders.
  - If comparing variants, change one variable at a time.
  - Preserve score reports and ledgers as retained artifacts.
